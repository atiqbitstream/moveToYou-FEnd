<div class="container mx-auto px-4 py-8 max-w-4xl">
  <!-- Page Header -->
  <div class="mb-6 flex justify-between items-center">
    <h2 class="text-2xl font-semibold text-gray-800">Add Delivery Items</h2>
    <button
      mat-icon-button
      color="primary"
      routerLink="/riders/dailyDeliveries"
      aria-label="Go back"
    >
      <mat-icon>arrow_back</mat-icon>
    </button>
  </div>

  <!-- Delivery Items Table -->
  <form [formGroup]="deliveryItemForm" (ngSubmit)="submitDeliveryItems()" class="bg-white shadow-md rounded-lg p-6">
    <table class="w-full mb-4">
      <thead>
        <tr class="text-left border-b-2 border-gray-200">
          <th class="pb-2">Product</th>
          <th class="pb-2">Unit Price</th>
          <th class="pb-2">Quantity</th>
          <th class="pb-2 text-right">Total Price</th>
        </tr>
      </thead>
      <tbody formArrayName="items">
        <tr *ngFor="let item of deliveryItemsFormArray.controls; let i = index" [formGroupName]="i">
          <td class="py-2">
            {{ products[i].name }}
            <input type="hidden" formControlName="productId">
          </td>
          <td class="py-2">
            PKR {{ item.get('unitPrice')?.value | number:'1.2-2' }}
          </td>
          <td class="py-2">
            <div class="flex items-center gap-2">
              <button 
                mat-icon-button 
                type="button" 
                (click)="decrementQuantity(i)"
                [disabled]="item.get('quantity')?.value === 0"
              >
                <mat-icon>remove</mat-icon>
              </button>
              <input
                class="w-16 text-center border rounded"
                type="number"
                formControlName="quantity"
                min="0"
              >
              <button 
                mat-icon-button 
                type="button" 
                (click)="incrementQuantity(i)"
              >
                <mat-icon>add</mat-icon>
              </button>
            </div>
          </td>
          <td class="py-2 text-right">
            PKR {{ (item.get('quantity')?.value * item.get('unitPrice')?.value || 0) | number:'1.2-2' }}
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Grand Total -->
    <div class="bg-gray-50 rounded-md p-3 mb-4 text-right">
      <p class="text-lg font-semibold">
        Grand Total: PKR {{ totalPrice | number:'1.2-2' }}
      </p>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-between space-x-4">
      <button 
        mat-stroked-button 
        type="button" 
        color="warn"
        (click)="onCancel()"
        class="flex-grow"
      >
        Cancel
      </button>
      <button 
        mat-raised-button 
        type="submit" 
        color="primary"
        [disabled]="deliveryItemForm.invalid || totalPrice === 0"
        class="flex-grow"
      >
        Save Items
      </button>
    </div>
  </form>
</div>
